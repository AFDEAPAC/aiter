# AMD AVO — topk-prefill fp32 MI355X (FROZEN CONTRACT)
# Change acceptance/correctness/shape policy only by forking evo/<name>-v2.
workflow: amd-avo-kernel-evolution
kernel: topk_indices_kernel
kernel_type: generic
seed_commit: a3396455072a3be94581993cb2519852ba48fe7e

arch:
  target: gfx950
  isa_skill_policy: on_demand

toolchain:
  rocm_version: "10.0"
  container_image: "rocm/ali-private:ubuntu22.04_rocm10.0.0_cp313_torch2.12.0_20260910"
  compiler: "hipcc, --offload-arch=gfx950"

budget:
  wall_clock_hours: 72
  max_versions: 80

target_metric: wall_ms
goal: "beat 0.760 ms (customer gluon, MI355X prefill topk) -- MET at 0.6194 ms"

frozen:
  bench_binary: ./benchmark_topk
  bench_argv: ["--mode", "verify_and_time", "--m", "4096", "--n", "131072", "--topk", "2048", "--warmup", "20", "--iters", "100", "--repeats", "5"]
  metric: "wall_ms median of 5 run-medians from the TIMING line (per-call, all phases)"
  kernel_time_metric: "rocprofv3 --kernel-trace sum of the 4 phase kernels"
  gpu: "HIP_VISIBLE_DEVICES=0"
  dtype: fp32
  shape: "M=4096 N=131072 K=2048, int32 indices only"
  reject_stddev_pct: 2.0
  runs_per_measurement: 5
  correctness_gate: "bench/correctness.py -- five gates, each proven red by fault injection"
  external_reference: "gluon 0.760 ms (not reproduced locally); aiter 0.950 ms (not reproduced)"

# All measured on this machine; see knowledge/s0_baseline.json and scripts/bw_kernel.hip.
measured_floors:
  read_only_2147mb_ms: 0.3516          # 6.11 TB/s, grid-stride
  read_only_rowmajor_gx1_wg512_ms: 0.3490
  read_plus_94mb_write_ms: 0.4361      # the floor Phase B is actually judged against
  copy_ms: 0.9596                      # 4.48 TB/s read+write
  pipeline_floor_ms: 0.4821            # phase_b 0.4361 + phase_c 0.024 + phase_a 0.022
  note: "A read-only floor understates Phase B: HBM writes cost more per byte, and the
         94 MB of candidates alone account for 87 us."

baseline:
  seed_x0_wall_ms: 2.9587
  torch_topk_wall_ms: 4.8541
  best_wall_ms: 0.6194
  best_stddev_pct: 0.067
  best_commit: x_7
  fallback_rows_at_best: 0

acceptance:
  rule: min_latency
  detail: "commit iff all five correctness gates pass AND prefill_main wall_ms median
           improves, with stddev < 2%"

shapes:
  - name: prefill_main
    m: 4096
    n: 131072
    topk: 2048
    dtype: fp32
    enabled: true
    scored: true
  - name: guard_k512
    m: 4096
    n: 131072
    topk: 512
    dtype: fp32
    enabled: true
    scored: false
  - name: guard_n32k
    m: 4096
    n: 32768
    topk: 2048
    dtype: fp32
    enabled: true
    scored: false

correctness:
  command_argv: ["python3", "bench/correctness.py"]
  command: "python3 bench/correctness.py"
  frozen: true
  gates:
    - "value multiset bitwise-equal to torch.topk"
    - "index uniqueness"
    - "exactly K outputs, all in range"
    - "input[index[i]] matches the reference multiset"
    - "distributions: uniform, gaussian, all-equal, +inf, adversarial"
  dual_path: "the fused fast path and the exact fallback are verified separately;
              --pipeline direct runs the fallback over every row as an independent
              full-row oracle, so the timed path is never certified by a sibling path"

bench:
  command_argv: ["bash", "bench/run.sh"]
  command: "bash bench/run.sh"
  output: score.json
  benchmark_warmup: 20
  benchmark_repeat: 100
  warmup: 20
  repeat: 100
  reject_stddev_pct: 2.0
  remeasure_best_with_candidate: true

shipped_config:
  phase_b: 4          # wave-private regions + LDS-staged contiguous flush
  cf_block: 512
  phase_c_block: 512
  phase_a_block: 512
  sample_s: 8192
  phase_a_passes: 3
  margin: auto        # derived from the rank estimator's noise
  hist_replicas: 4

notes:
  - "Prefill-only scope; decode (M=4) is out of scope for this run."
  - "Correctness is a hard gate and was never traded for throughput."
  - "Falsified directions live in knowledge/known_bad.md with their numbers."
