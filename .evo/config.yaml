# AMD AVO — topk-prefill fp32 MI355X (FROZEN CONTRACT)
workflow: amd-avo-kernel-evolution
kernel: topk_indices_kernel
kernel_type: generic
seed_commit: a3396455072a3be94581993cb2519852ba48fe7e

arch:
  target: gfx950
  isa_skill_policy: on_demand

toolchain:
  rocm_version: "10.0"
  container_image: "rocm/ali-private:ubuntu22.04_rocm10.0.0_cp313_torch2.12.0_20260910"

budget:
  wall_clock_hours: 72
  max_versions: 80

target_metric: wall_ms
goal: "beat target 0.760 ms (customer gluon MI355X prefill topk)"

frozen:
  bench_binary: ./benchmark_topk
  bench_argv: ["--mode", "verify_and_time", "--m", "4096", "--n", "131072", "--topk", "2048", "--warmup", "20", "--iters", "100", "--repeats", "5"]
  metric: "wall_ms median from benchmark_topk TIMING line (per-call, includes all phases)"
  kernel_time_metric: "rocprofv3 sum of coarse_filter_fp32 + sample_fp32 + gather_topk_fp32 (diagnostic)"
  gpu: "HIP_VISIBLE_DEVICES=0"
  dtype: fp32
  shape: "M=4096 N=131072 K=2048 indices-only int32"
  reject_stddev_pct: 2.0
  runs_per_measurement: 5
  correctness_gate: "bench/correctness.py five gates + inject-fault red"
  external_reference: "gluon 0.760 ms (not reproduced locally); torch.topk 4.841 ms anchor"

baseline:
  hbm_stream_bandwidth_gib_s: 8897.63
  hbm_stream_median_ms: 0.4496
  theoretical_read_floor_ms: 0.253
  torch_topk_wall_ms: 4.8409
  seed_x0_wall_ms: 2.9587
  seed_x0_stddev_pct: 0.061
  measured_on: "MI355X gfx950, /home/mh/topk-prefill-avo @ seed x_0"

acceptance:
  rule: min_latency
  detail: "commit iff correctness PASS AND prefill_main wall_ms median improves with stddev < 2%"

shapes:
  - name: prefill_main
    m: 4096
    n: 131072
    topk: 2048
    dtype: fp32
    enabled: true
  - name: guard_n32k
    m: 64
    n: 32768
    topk: 512
    dtype: fp32
    enabled: true
    score: false
  - name: guard_k512
    m: 4096
    n: 131072
    topk: 512
    dtype: fp32
    enabled: true
    score: false

correctness:
  command_argv: ["python3", "bench/correctness.py"]
  command: "python3 bench/correctness.py"
  frozen: true

bench:
  command_argv: ["bash", "bench/run.sh"]
  command: "bash bench/run.sh"
  output: score.json
  benchmark_warmup: 20
  benchmark_repeat: 100
  warmup: 20
  repeat: 100
  reject_stddev_pct: 2.0
  remeasure_best_with_candidate: true

notes:
  - "Prefill-only scope; decode M=4 out of scope."
  - "Three-stage sampled pipeline + Phase D fallback; 4x8-bit radix for fp32 exact select."
  - "S0 floor: ~253 ms HBM read-only; seed x_0 ~2.96 ms wall (~11.7x off floor)."
